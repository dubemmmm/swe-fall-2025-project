<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Pet for Adoption - Pet Next Door</title>
    <link rel="stylesheet" href="adoption-form.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container-header">
            <button class="back-button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>Back to Dashboard</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-form">
            <!-- Title Section -->
            <div class="title-section">
                <h1>Post Your Pet for Adoption</h1>
                <p>Fill out the details below to help your pet find their forever home.</p>
            </div>

            <!-- Form Card -->
            <div class="form-card">
                <form id="petAdoptionForm">
                    <!-- Pet Name -->
                    <div class="form-group">
                        <label for="petName" class="form-label">Pet Name</label>
                        <input 
                            type="text" 
                            id="petName" 
                            name="petName" 
                            class="form-input" 
                            placeholder="Enter your pet's name"
                            required
                        >
                        <span class="error-message" id="petNameError"></span>
                    </div>

                    <!-- Animal Type -->
                    <div class="form-group">
                        <label for="animalType" class="form-label">Animal Type</label>
                        <select 
                            id="animalType" 
                            name="animalType" 
                            class="form-select"
                            required
                        >
                            <option value="">Select animal type</option>
                            <option value="dog">Dog</option>
                            <option value="cat">Cat</option>
                            <option value="rabbit">Rabbit</option>
                            <option value="bird">Bird</option>
                            <option value="hamster">Hamster</option>
                            <option value="other">Other</option>
                        </select>
                        <span class="error-message" id="animalTypeError"></span>
                    </div>

                    <!-- Age and Gender Row -->
                    <div class="form-row">
                        <!-- Age -->
                        <div class="form-group">
                            <label for="age" class="form-label">Age</label>
                            <input 
                                type="number" 
                                id="age" 
                                name="age" 
                                class="form-input" 
                                placeholder="Age in years"
                                min="0"
                                required
                            >
                            <span class="error-message" id="ageError"></span>
                        </div>

                        <!-- Gender -->
                        <div class="form-group">
                            <label for="gender" class="form-label">Gender</label>
                            <select 
                                id="gender" 
                                name="gender" 
                                class="form-select"
                                required
                            >
                                <option value="">Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                            <span class="error-message" id="genderError"></span>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="description" class="form-label">Description</label>
                        <textarea 
                            id="description" 
                            name="description" 
                            class="form-textarea" 
                            placeholder="Tell us about your pet's personality, habits, and any special needs..."
                            rows="5"
                            required
                        ></textarea>
                        <span class="error-message" id="descriptionError"></span>
                    </div>

                    <!-- Upload Photo -->
                    <div class="form-group">
                        <label class="form-label">Upload Photo</label>
                        <div class="upload-area" id="uploadArea">
                            <div class="upload-prompt" id="uploadPrompt">
                                <div class="upload-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="17 8 12 3 7 8"/>
                                        <line x1="12" y1="3" x2="12" y2="15"/>
                                    </svg>
                                </div>
                                <div>
                                    <p class="upload-text">Click to upload or drag and drop</p>
                                    <p class="upload-subtext">PNG, JPG or JPEG (max. 5MB)</p>
                                </div>
                            </div>
                            <div class="image-preview" id="imagePreview" style="display: none;">
                                <img id="previewImage" src="" alt="Preview">
                                <button type="button" class="remove-image-btn" id="removeImageBtn">
                                    Remove Image
                                </button>
                            </div>
                            <input 
                                type="file" 
                                id="photoUpload" 
                                name="photo" 
                                accept="image/*"
                                style="display: none;"
                            >
                        </div>
                        <span class="error-message" id="photoError"></span>
                    </div>

                    <!-- Checkboxes -->
                    <div class="form-group">
                        <label class="form-label">Additional Information</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input 
                                    type="checkbox" 
                                    id="vaccinated" 
                                    name="vaccinated"
                                    class="checkbox-input"
                                >
                                <label for="vaccinated" class="checkbox-label">Vaccinated</label>
                            </div>
                            <div class="checkbox-item">
                                <input 
                                    type="checkbox" 
                                    id="goodWithKids" 
                                    name="goodWithKids"
                                    class="checkbox-input"
                                >
                                <label for="goodWithKids" class="checkbox-label">Good with Kids</label>
                            </div>
                            <div class="checkbox-item">
                                <input 
                                    type="checkbox" 
                                    id="spayedNeutered" 
                                    name="spayedNeutered"
                                    class="checkbox-input"
                                >
                                <label for="spayedNeutered" class="checkbox-label">Spayed/Neutered</label>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="submit-section">
                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span id="submitText">Post for Adoption</span>
                            <span id="submitLoader" class="loader" style="display: none;">
                                <svg class="spinner" viewBox="0 0 24 24">
                                    <circle class="spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                                </svg>
                                Posting...
                            </span>
                        </button>
                        <a href="{% url 'adoption:list' %}" class="cancel-btn">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-content">
            <div class="toast-icon" id="toastIcon"></div>
            <div class="toast-text">
                <p class="toast-title" id="toastTitle"></p>
                <p class="toast-description" id="toastDescription"></p>
            </div>
        </div>
    </div>

    <script src="adoption-form.js"></script>
</body>
</html>

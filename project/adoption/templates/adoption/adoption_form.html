<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Pet for Adoption - Pet Next Door</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #FFF5F2 0%, #FFE4DC 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            max-width: 800px;
            margin: 0 auto 20px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            color: #374151;
            transition: all 0.2s;
        }

        .back-button:hover {
            background: #F9FAFB;
            border-color: #FF6B35;
        }

        .back-button .icon {
            width: 20px;
            height: 20px;
        }

        .container-form {
            max-width: 800px;
            margin: 0 auto;
        }

        .title-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .title-section h1 {
            font-size: 32px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .title-section p {
            font-size: 16px;
            color: #6B7280;
        }

        .form-card {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.2s;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            outline: none;
            border-color: #FF6B35;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .upload-area {
            border: 2px dashed #E5E7EB;
            border-radius: 8px;
            padding: 32px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: #FF6B35;
            background: #FFF5F2;
        }

        .upload-icon {
            width: 48px;
            height: 48px;
            margin: 0 auto 16px;
            color: #FF6B35;
        }

        .upload-icon svg {
            width: 100%;
            height: 100%;
        }

        .upload-text {
            font-size: 16px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 4px;
        }

        .upload-subtext {
            font-size: 14px;
            color: #6B7280;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-label {
            font-size: 14px;
            color: #374151;
            cursor: pointer;
        }

        .submit-section {
            display: flex;
            gap: 16px;
            margin-top: 32px;
        }

        .submit-btn {
            flex: 1;
            background: #FF6B35;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            background: #e64a19;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .cancel-btn {
            padding: 14px 24px;
            background: white;
            color: #6B7280;
            text-decoration: none;
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s;
            text-align: center;
        }

        .cancel-btn:hover {
            background: #F9FAFB;
            border-color: #D1D5DB;
        }

        .error-message {
            display: block;
            color: #dc2626;
            font-size: 14px;
            margin-top: 4px;
        }

        @media (max-width: 768px) {
            .form-card {
                padding: 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .submit-section {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container-header">
            <button class="back-button">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                <span>Back to Dashboard</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container-form">
            <!-- Title Section -->
            <div class="title-section">
                <h1>Post Your Pet for Adoption</h1>
                <p>Fill out the details below to help your pet find their forever home.</p>
            </div>

            <!-- Form Card -->
            <div class="form-card">
                <form id="petAdoptionForm">
                    <!-- Pet Name -->
                    <div class="form-group">
                        <label for="petName" class="form-label">Pet Name</label>
                        <input 
                            type="text" 
                            id="petName" 
                            name="petName" 
                            class="form-input" 
                            placeholder="Enter your pet's name"
                            required
                        >
                        <span class="error-message" id="petNameError"></span>
                    </div>

                    <!-- Animal Type -->
                    <div class="form-group">
                        <label for="animalType" class="form-label">Animal Type</label>
                        <select 
                            id="animalType" 
                            name="animalType" 
                            class="form-select"
                            required
                        >
                            <option value="">Select animal type</option>
                            <option value="dog">Dog</option>
                            <option value="cat">Cat</option>
                            <option value="rabbit">Rabbit</option>
                            <option value="bird">Bird</option>
                            <option value="hamster">Hamster</option>
                            <option value="other">Other</option>
                        </select>
                        <span class="error-message" id="animalTypeError"></span>
                    </div>

                    <!-- Age and Gender Row -->
                    <div class="form-row">
                        <!-- Age -->
                        <div class="form-group">
                            <label for="age" class="form-label">Age</label>
                            <input 
                                type="number" 
                                id="age" 
                                name="age" 
                                class="form-input" 
                                placeholder="Age in years"
                                min="0"
                                required
                            >
                            <span class="error-message" id="ageError"></span>
                        </div>

                        <!-- Gender -->
                        <div class="form-group">
                            <label for="gender" class="form-label">Gender</label>
                            <select 
                                id="gender" 
                                name="gender" 
                                class="form-select"
                                required
                            >
                                <option value="">Select gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                            </select>
                            <span class="error-message" id="genderError"></span>
                        </div>
                    </div>

                    <!-- Description -->
                    <div class="form-group">
                        <label for="description" class="form-label">Description</label>
                        <textarea 
                            id="description" 
                            name="description" 
                            class="form-textarea" 
                            placeholder="Tell us about your pet's personality, habits, and any special needs..."
                            rows="5"
                            required
                        ></textarea>
                        <span class="error-message" id="descriptionError"></span>
                    </div>

                    <!-- Upload Photo -->
                    <div class="form-group">
                        <label class="form-label">Upload Photo</label>
                        <div class="upload-area" id="uploadArea">
                            <div class="upload-prompt" id="uploadPrompt">
                                <div class="upload-icon">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                        <polyline points="17 8 12 3 7 8"/>
                                        <line x1="12" y1="3" x2="12" y2="15"/>
                                    </svg>
                                </div>
                                <div>
                                    <p class="upload-text">Click to upload or drag and drop</p>
                                    <p class="upload-subtext">PNG, JPG or JPEG (max. 5MB)</p>
                                </div>
                            </div>
                            <div class="image-preview" id="imagePreview" style="display: none;">
                                <img id="previewImage" src="" alt="Preview">
                                <button type="button" class="remove-image-btn" id="removeImageBtn">
                                    Remove Image
                                </button>
                            </div>
                            <input 
                                type="file" 
                                id="photoUpload" 
                                name="photo" 
                                accept="image/*"
                                style="display: none;"
                            >
                        </div>
                        <span class="error-message" id="photoError"></span>
                    </div>

                    <!-- Checkboxes -->
                    <div class="form-group">
                        <label class="form-label">Additional Information</label>
                        <div class="checkbox-group">
                            <div class="checkbox-item">
                                <input 
                                    type="checkbox" 
                                    id="vaccinated" 
                                    name="vaccinated"
                                    class="checkbox-input"
                                >
                                <label for="vaccinated" class="checkbox-label">Vaccinated</label>
                            </div>
                            <div class="checkbox-item">
                                <input 
                                    type="checkbox" 
                                    id="goodWithKids" 
                                    name="goodWithKids"
                                    class="checkbox-input"
                                >
                                <label for="goodWithKids" class="checkbox-label">Good with Kids</label>
                            </div>
                            <div class="checkbox-item">
                                <input 
                                    type="checkbox" 
                                    id="spayedNeutered" 
                                    name="spayedNeutered"
                                    class="checkbox-input"
                                >
                                <label for="spayedNeutered" class="checkbox-label">Spayed/Neutered</label>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="submit-section">
                        <button type="submit" class="submit-btn" id="submitBtn">
                            <span id="submitText">Post for Adoption</span>
                            <span id="submitLoader" class="loader" style="display: none;">
                                <svg class="spinner" viewBox="0 0 24 24">
                                    <circle class="spinner-circle" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"/>
                                </svg>
                                Posting...
                            </span>
                        </button>
                        <a href="{% url 'adoption:list' %}" class="cancel-btn">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast">
        <div class="toast-content">
            <div class="toast-icon" id="toastIcon"></div>
            <div class="toast-text">
                <p class="toast-title" id="toastTitle"></p>
                <p class="toast-description" id="toastDescription"></p>
            </div>
        </div>
    </div>

</body>
</html>

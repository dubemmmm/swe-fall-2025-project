{% extends 'base.html' %}

{% block content %}
<h1>{% if object %}Edit{% else %}Create{% endif %} Pet Profile</h1>
<form method="post" enctype="multipart/form-data" class="auth-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="submit-btn">Save Pet</button>
</form>
{% endblock %}
